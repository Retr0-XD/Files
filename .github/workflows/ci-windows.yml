name: CI (Windows)

on:
  push:
    branches:
      - feature/middle-click-tabs
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Print environment
        run: |
          dotnet --info
          systeminfo | findstr /B /C:"OS Name" /C:"OS Version"

      - name: Install WinAppDriver
        shell: pwsh
        continue-on-error: true
        run: |
          choco install winappdriver -y

      - name: Start WinAppDriver
        shell: pwsh
        continue-on-error: true
        run: |
          $path1 = 'C:\Program Files (x86)\Windows Application Driver\WinAppDriver.exe'
          $path2 = 'C:\Program Files\Windows Application Driver\WinAppDriver.exe'
          if (Test-Path $path1) { Start-Process $path1 '127.0.0.1 4723' -NoNewWindow }
          elseif (Test-Path $path2) { Start-Process $path2 '127.0.0.1 4723' -NoNewWindow }
          else { Write-Host 'WinAppDriver not found; UI tests may be skipped.' }

      - name: Restore
        run: dotnet restore Files.slnx -p:EnableWindowsTargeting=true

      - name: Build managed projects (skip C++)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @(
            'src/Files.App/Files.App.csproj',
            'src/Files.App.Controls/Files.App.Controls.csproj',
            'src/Files.App.CsWin32/Files.App.CsWin32.csproj',
            'src/Files.App.Storage/Files.App.Storage.csproj',
            'src/Files.App.BackgroundTasks/Files.App.BackgroundTasks.csproj',
            'src/Files.Core.SourceGenerator/Files.Core.SourceGenerator.csproj',
            'src/Files.Core.Storage/Files.Core.Storage.csproj',
            'src/Files.Shared/Files.Shared.csproj'
          )
          foreach ($p in $projects) {
            Write-Host "Building $p"
            dotnet build $p -c Release -p:EnableWindowsTargeting=true --no-restore
          }

      - name: Publish managed app (no ReadyToRun)
        shell: pwsh
        run: |
          dotnet publish src/Files.App/Files.App.csproj -c Release -p:EnableWindowsTargeting=true -p:PublishReadyToRun=false -o "src/Files.App/bin/Publish" || exit 0

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-outputs
          path: |
            src/Files.App/bin/Release
            src/Files.App/bin/Publish

      - name: Run interaction tests
        continue-on-error: true
        run: dotnet test tests/Files.InteractionTests/Files.InteractionTests.csproj -c Release --no-build -p:PublishReadyToRun=false --logger "trx;LogFileName=interactiontests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-tests-results
          path: |
            tests/Files.InteractionTests/TestResults
            **/*.trx
