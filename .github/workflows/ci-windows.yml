name: CI (Windows)

on:
  push:
    branches:
      - feature/middle-click-tabs
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install WinAppDriver
        shell: powershell
        run: |
          choco install winappdriver -y

      - name: Start WinAppDriver
        shell: powershell
        run: |
          Start-Process 'C:\Program Files (x86)\Windows Application Driver\WinAppDriver.exe' -ArgumentList '127.0.0.1 4723' -NoNewWindow

      - name: Restore
        run: dotnet restore Files.slnx

      - name: Build
        run: dotnet build Files.slnx -c Release --no-restore

      - name: Run interaction tests
        run: dotnet test tests/Files.InteractionTests/Files.InteractionTests.csproj -c Release --no-build --logger "trx;LogFileName=interactiontests.trx"name: CI (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Print environment
        run: |
          dotnet --info
          systeminfo | findstr /B /C:"OS Name" /C:"OS Version"

      - name: Install WinAppDriver
        shell: pwsh
        continue-on-error: true
        run: |
          choco install winappdriver -y

      - name: Start WinAppDriver
        shell: pwsh
        continue-on-error: true
        run: |
          $path1 = 'C:\Program Files (x86)\Windows Application Driver\WinAppDriver.exe'
          $path2 = 'C:\Program Files\Windows Application Driver\WinAppDriver.exe'
          if (Test-Path $path1) { Start-Process $path1 '127.0.0.1 4723' -NoNewWindow }
          elseif (Test-Path $path2) { Start-Process $path2 '127.0.0.1 4723' -NoNewWindow }
          else { Write-Host 'WinAppDriver not found; UI tests may be skipped.' }

      - name: Restore
        run: dotnet restore Files.slnx

      - name: Build
        run: dotnet build Files.slnx -c Release --no-restore

      - name: Run interaction tests
        continue-on-error: true
        run: dotnet test tests/Files.InteractionTests/Files.InteractionTests.csproj -c Release --no-build --logger "trx;LogFileName=interactiontests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-tests-results
          path: |
            tests/Files.InteractionTests/TestResults
            **/*.trx
